<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Jobs</title>
</head>

<body>

    <h1>Gerenciamento de Jobs</h1>

    <form action="/gerenciamento-jobs/agendar" method="post">

        <label for="produto">Produto:</label>
        <br>
        <input type="text" id="produto" name="produto">

        <br><br>

        <label for="data">Data:</label>
        <br>
        <input type="date" id="data" name="data">

        <br><br>

        <label for="horario">Horário:</label>
        <br>
        <input type="time" id="horario" name="horario">

        <br><br>

        <button type="submit">Agendar Job</button>

    </form>

    <script>

        const parametros = new URLSearchParams(window.location.search);

        const produto = parametros.get("produto");
        const data = parametros.get("data");
        const horario = parametros.get("horario");

        if (produto) {
            document.getElementById("produto").value = produto;
        }

        if (data) {
            document.getElementById("data").value = data;
        }

        if (horario) {
            document.getElementById("horario").value = horario;
        }

    </script>
    
</body>

</html>
